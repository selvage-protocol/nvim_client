name: ci

# No `push: branches: [main]`: a pull request already runs the whole job, and the
# merge commit carries the same content, so the merge would run it a second time.
# `workflow_dispatch` is the re-run for a commit that reached `main` without one.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The companion's suite only. The two-instance proof needs a built `selvaged` from the
      # sibling `reference_server` repository and a real Neovim, neither of which this workflow
      # checks out; `scripts/e2e/run-two-instance.sh` runs it locally.
      - run: npm test
