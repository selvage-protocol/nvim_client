name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The companion's suite only. The two-instance proof needs a built `selvaged` from the
      # sibling `reference_server` repository and a real Neovim, neither of which this workflow
      # checks out; `scripts/e2e/run-two-instance.sh` runs it locally.
      - run: npm test
