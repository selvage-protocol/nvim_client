name: ci

# No `push: branches: [main]`: a pull request already runs the whole job, and the
# merge commit carries the same content, so the merge would run it a second time.
# `workflow_dispatch` is the re-run for a commit that reached `main` without one.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The guard around a workflow's `dry_run` input (`scripts/check_dry_run_gating.py`):
      # `release.yml` declares one, its plan step carries `inputs.dry_run == true` and every step
      # after it `inputs.dry_run != true`, which is the whole of what keeps a rehearsal from
      # cutting a release. `actionlint` cannot see a condition that is *missing* from a step, so
      # nothing else reads that. This runs the guard's own suite and then the guard over the
      # workflows here; `scripts/ci-local.sh checks` builds the same two files as the flake check
      # `dry-run-gating`, whose Python supplies the PyYAML pinned below.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: install the guard's dependency
        run: python3 -m pip install pyyaml==6.0.3

      - name: the release workflow's dry_run gating
        run: |
          python3 -B scripts/test_check_dry_run_gating.py
          python3 -B scripts/check_dry_run_gating.py .github/workflows

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The companion's suite only. The two-instance proof needs a built `selvaged` from the
      # sibling `reference_server` repository and a real Neovim, neither of which this workflow
      # checks out; `scripts/e2e/run-two-instance.sh` runs it locally.
      - run: npm test
